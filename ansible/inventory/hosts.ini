# ===================================================================
# Ansible Inventory - apni VM / server ka IP yahan daalo
#
# Free VM kahan se milegi:
#   - Oracle Cloud Free Tier (best, permanently free)
#   - AWS EC2 t2.micro (12 month free)
#   - Apna laptop pe VirtualBox + Ubuntu VM
#   - GitHub Codespaces (2 core, free 120 hrs/month)
# ===================================================================

[webservers]
# FORMAT:  <alias>  ansible_host=<IP>  ansible_user=<user>
studentdesk-vm ansible_host=YOUR_VM_IP ansible_user=ubuntu

[monitoring]
studentdesk-vm

[all:vars]
ansible_ssh_private_key_file=~/.ssh/your-vm-key.pem
ansible_python_interpreter=/usr/bin/python3
