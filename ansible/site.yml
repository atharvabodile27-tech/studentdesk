---
# ===================================================================
# MASTER PLAYBOOK - ek command me pura setup
#
#   ansible-playbook site.yml -i inventory/hosts.ini
#
# Sirf ek step chalana ho:
#   ansible-playbook site.yml -i inventory/hosts.ini --tags provision
#   ansible-playbook site.yml -i inventory/hosts.ini --tags deploy
# ===================================================================

- name: Step 1 - Server provision (Docker, Python, firewall)
  ansible.builtin.import_playbook: playbooks/provision.yml
  tags: [provision]

- name: Step 2 - Application deploy
  ansible.builtin.import_playbook: playbooks/deploy.yml
  tags: [deploy]

- name: Step 3 - Monitoring stack
  ansible.builtin.import_playbook: playbooks/monitoring.yml
  tags: [monitoring]
