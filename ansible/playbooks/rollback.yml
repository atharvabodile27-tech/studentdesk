---
# ===================================================================
# ROLLBACK PLAYBOOK  (DevOps me ye bahut important hai!)
# Agar naya version fail ho jaye to purane version pe wapas jao.
#
# Run:  ansible-playbook playbooks/rollback.yml -e "image_tag=1.0.0"
# ===================================================================
- name: Rollback StudentDesk to previous version
  hosts: webservers
  become: true

  vars:
    app_port: 5000
    image_name: studentdesk
    image_tag: "{{ rollback_tag | default('1.0.0') }}"
    secret_key: "{{ lookup('env', 'APP_SECRET_KEY') | default('ansible-deploy-secret', true) }}"

  tasks:
    - name: Rollback ke liye target version
      ansible.builtin.debug:
        msg: "⏪ Rolling back to {{ image_name }}:{{ image_tag }}"

    - name: Check karo image available hai ya nahi
      community.docker.docker_image_info:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
      register: image_info

    - name: Image na mile to fail karo
      ansible.builtin.fail:
        msg: "Image {{ image_name }}:{{ image_tag }} is machine pe nahi mili. Pehle pull karo."
      when: image_info.images | length == 0

    - name: Current container hatao
      community.docker.docker_container:
        name: studentdesk
        state: absent

    - name: Purani image se container start karo
      community.docker.docker_container:
        name: studentdesk
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ app_port }}:5000"
        env:
          SECRET_KEY: "{{ secret_key }}"
          APP_VERSION: "{{ image_tag }}"
        volumes:
          - studentdesk_data:/app/instance

    - name: Health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 5
      delay: 3
      until: health.status == 200

    - name: Rollback success
      ansible.builtin.debug:
        msg: "✅ Rollback successful — ab version {{ image_tag }} chal raha hai."
