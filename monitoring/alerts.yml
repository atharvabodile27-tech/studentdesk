# ===================================================================
# Prometheus alert rules
# Inhe Alertmanager pe bhej sakte ho (email/Slack) — college demo ke
# liye rules file dikhana hi kaafi hai.
# ===================================================================
groups:
  - name: studentdesk-alerts
    rules:
      - alert: AppIsDown
        expr: up{job="studentdesk-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "StudentDesk application is down"
          description: "{{ $labels.instance }} has not responded for the last 1 minute."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(studentdesk_http_request_duration_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Request latency is high"
          description: "95th percentile latency is above 1 second."

      - alert: HighErrorRate
        expr: sum(rate(studentdesk_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate is high"

      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Server CPU usage above 85%"

      - alert: HostOutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Server available memory below 15%"

      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Server disk free space below 15%"
