# ===================================================================
# Grafana dashboard provisioning
# /var/lib/grafana/dashboards folder mount hota hai (docker-compose me),
# usme rakha studentdesk.json apne aap load ho jayega.
# ===================================================================
apiVersion: 1

providers:
  - name: studentdesk
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false