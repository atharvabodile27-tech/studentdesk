# ===================================================================
# docker-compose.yml  ->  App + (optionally) monitoring stack
#
#   sirf app chalana:      docker compose up -d app
#   pura stack:            docker compose --profile monitoring up -d
#   sirf monitoring:       docker compose --profile monitoring up -d prometheus grafana node-exporter
#   logs dekhna:           docker compose logs -f app
#   band karna:            docker compose down
# ===================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: studentdesk:1.0.0
    container_name: studentdesk-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-compose-secret-key}
      - APP_VERSION=1.0.0
      - DATABASE_URL=sqlite:////app/instance/studentdesk.db
    volumes:
      - app_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - studentdesk-net

  # ---------------- Monitoring (optional profile) ----------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: studentdesk-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - studentdesk-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: studentdesk-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - studentdesk-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: studentdesk-node-exporter
    profiles: ["monitoring"]
    ports:
      - "9100:9100"
    networks:
      - studentdesk-net

volumes:
  app_data:
  prometheus_data:
  grafana_data:

networks:
  studentdesk-net:
    driver: bridge