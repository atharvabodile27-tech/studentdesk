# ===================================================================
# GitHub Actions CI/CD  (Free me chalta hai - GitHub pe host ho jata hai)
#
# Kab trigger hota hai:
#   - push on main  -> full pipeline (test + docker + deploy)
#   - pull_request  -> sirf test (code review ke liye)
# ===================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}          # manual "Run workflow" button

env:
  IMAGE_NAME: studentdesk
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------
  # JOB 1 : Build + Test
  # ---------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]   # 2 Python versions pe test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check (build)
        run: python -m compileall -q app run.py

      - name: Run pytest (unit + app + api)
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: reports/results.xml

  # ---------------------------------------------------------------
  # JOB 2 : Docker image build + push (sirf main branch pe)
  # ---------------------------------------------------------------
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test                                  # tests pass hone ke baad hi chalega
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write                            # GHCR pe push karne ke liye

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # JOB 3 : Deploy (SSH se apni VM pe) - optional
  # Secrets me DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY add karna
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Pulling latest image ==="
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest || true
            echo "=== Restarting container ==="
            docker rm -f studentdesk || true
            docker run -d --name studentdesk --restart unless-stopped \
              -p 5000:5000 \
              -e SECRET_KEY="${{ secrets.APP_SECRET_KEY }}" \
              ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            sleep 6
            echo "=== Health check ==="
            curl -fsS http://localhost:5000/health
            echo ""
            echo "=== Deployed successfully ==="
